<body>
  <div id="appProvider" style="display: none"></div>
  <div id="app">
    <style>
      .BMap_cpyCtrl,
      .anchorBL {
        display: none;
      }
    </style>
    <style>
      .first-loading-wrap {
        display: flex;
        width: 100%;
        height: 100vh;
        justify-content: center;
        align-items: center;
        flex-direction: column;
      }

      .first-loading-wrap>h1 {
        font-size: 128px
      }

      .first-loading-wrap .loading-wrap {
        /* padding: 98px; */
        display: flex;
        justify-content: center;
        align-items: center
      }

      .dot {
        animation: antRotate 1.2s infinite linear;
        transform: rotate(45deg);
        position: relative;
        display: inline-block;
        font-size: 32px;
        width: 32px;
        height: 32px;
        box-sizing: border-box
      }

      .dot i {
        width: 14px;
        height: 14px;
        position: absolute;
        display: block;
        background-color: #454545;
        border-radius: 100%;
        transform: scale(.75);
        transform-origin: 50% 50%;
        opacity: .3;
        animation: antSpinMove 1s infinite linear alternate
      }

      .dot i:nth-child(1) {
        top: 0;
        left: 0
      }

      .dot i:nth-child(2) {
        top: 0;
        right: 0;
        -webkit-animation-delay: .4s;
        animation-delay: .4s
      }

      .dot i:nth-child(3) {
        right: 0;
        bottom: 0;
        -webkit-animation-delay: .8s;
        animation-delay: .8s
      }

      .dot i:nth-child(4) {
        bottom: 0;
        left: 0;
        -webkit-animation-delay: 1.2s;
        animation-delay: 1.2s
      }

      @keyframes antRotate {
        to {
          -webkit-transform: rotate(405deg);
          transform: rotate(405deg)
        }
      }

      @-webkit-keyframes antRotate {
        to {
          -webkit-transform: rotate(405deg);
          transform: rotate(405deg)
        }
      }

      @keyframes antSpinMove {
        to {
          opacity: 1
        }
      }

      @-webkit-keyframes antSpinMove {
        to {
          opacity: 1
        }
      }
    </style>
    <div class="first-loading-wrap" style="background-color: #fff;">
      <div class="loading-wrap">
        <span class="dot dot-spin"><i></i><i></i><i></i><i></i></span>
      </div>
      <div>
        <img style="width: 300px;height: 300px;" src="https://apt11-1251002327.cos.ap-tokyo.myqcloud.com/storage/public/2024-07-05/d2hieie6u6ucxcnvjp.gif" />
        <p style="text-align: center; color: #454545; font-size: 18px;"> 正在进入住一CRS哦~</p>
      </div>
    </div>
  </div>

</body>
